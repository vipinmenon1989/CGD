$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - samples
properties:
  samples:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
    additionalProperties:
      type: string
      minLength: 1
  modes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - comprehensive
        - crispri
        - crispra
        - cas9
        - cas12a
        - cas9_ng
  outdir:
    type: string
    minLength: 1
